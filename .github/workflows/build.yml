name: Game Build (بیلد بازی)

on:
  push:
    branches: [main, graphics-upgrade-2026-10-18, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI only needs to read source and publish workflow artifacts.
permissions:
  contents: read

# Avoid wasting runners on superseded commits while preserving independent PR builds.
concurrency:
  group: last-fortress-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Web Build (Next.js + asset validation)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./db/custom.db
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client and sync ephemeral CI database
        run: |
          bunx prisma generate
          # This database is created only for this CI job. Do not use
          # --accept-data-loss: schema changes should fail visibly, not hide destructive drift.
          bunx prisma db push --skip-generate

      - name: Strict TypeScript check
        run: bun run typecheck

      - name: Audit campaign and game data invariants
        run: bun run audit:logic

      - name: Audit wave economy and difficulty progression
        run: bun scripts/balance-audit.ts

      - name: Build web
        run: bun run build

      - name: Generate art readiness report
        run: ASSET_AUDIT_JSON=1 bun scripts/validate-rigged-characters.mjs

      - name: Upload art readiness report
        uses: actions/upload-artifact@v4
        with:
          name: Last-Fortress-art-readiness
          path: asset-art-readiness.json
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Android APKs (debug + release)
    runs-on: ubuntu-latest
    needs: web-build
    env:
      DATABASE_URL: file:./db/custom.db
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client and sync ephemeral CI database
        run: |
          bunx prisma generate
          bunx prisma db push --skip-generate

      - name: Build web export (CAP_BUILD)
        run: bun run build:cap

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Build release APK (signed only when protected keystore config is available)
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Verify APK outputs are present and non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          compgen -G 'android/app/build/outputs/apk/release/*.apk' >/dev/null
          find android/app/build/outputs/apk -type f -name '*.apk' -size +0c -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Last-Fortress-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Last-Fortress-release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
