name: Game Build (بیلد بازی)

on:
  push:
    branches: [main, graphics-upgrade-2026-10-18]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-build:
    name: Web Build (Next.js)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./db/custom.db
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate + sync db
        run: |
          bunx prisma generate
          bunx prisma db push --skip-generate --accept-data-loss

      - name: Build web
        run: bun run build

  android-apk:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    needs: web-build
    env:
      DATABASE_URL: file:./db/custom.db
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate + sync db
        run: |
          bunx prisma generate
          bunx prisma db push --skip-generate --accept-data-loss

      - name: Build web export (CAP_BUILD)
        run: bun run build:cap

      - name: Sync Capacitor android
        run: bunx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Last-Fortress-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
